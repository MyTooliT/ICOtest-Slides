# Inspiration: https://github.com/codebytes/github-actions-demos/blob/main/.github/workflows/marp-pages.yml

name: Build & Publish Slides

on: push

jobs:
  build:
    name: Build slides
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Copy resources
      run: just init-build

    - name: Create HTML version of slides
      uses: docker://marpteam/marp-cli:latest
      env:
        MARP_USER: root:root
      with:
        args: >
          --html
          -o build/index.html
          ICOtest.md
